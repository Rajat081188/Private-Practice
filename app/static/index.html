<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaCell Support</title>
<style>
  :root {
    --page-a: #efeaff; --page-b: #ffe9f3; --page-c: #fff3e4;
    --panel: #ffffff; --text: #1d1b2e; --muted: #5f5b78; --line: #e7e3f3; --soft: #f6f4fc;
    --brand: #5b3df5; --brand-2: #a62ba6; --brand-3: #c2326e; --brand-ink: #ffffff; --brand-soft: #efeaff;
    --bot: #f4f2fb; --focus: #7c5cff;
    --ok: #0b7a52; --ok-bg: #e0f5ec; --info: #1d5fc2; --info-bg: #e4eefc;
    --warn: #8a5200; --warn-bg: #fff1d9; --bad: #b42f25; --bad-bg: #fde8e6; --neutral: #5f5b78; --neutral-bg: #efedf5;
    --t-blue: #2457d6; --t-blue-bg: #e6eeff; --t-amber: #a65200; --t-amber-bg: #fff0d9;
    --t-green: #0b7a52; --t-green-bg: #dff5ea; --t-teal: #0b6f80; --t-teal-bg: #ddf3f6;
    --t-pink: #b0175a; --t-pink-bg: #fde6f0; --t-violet: #6229d1; --t-violet-bg: #eee7ff;
    --t-orange: #b23f0c; --t-orange-bg: #ffe8d9;
    --shadow: 0 10px 40px rgba(70, 40, 160, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-a: #15122a; --page-b: #1f1226; --page-c: #1c1712;
      --panel: #1b1930; --text: #ecebf5; --muted: #a8a4c2; --line: #302c4c; --soft: #232040;
      --brand: #8d78ff; --brand-2: #c75cc7; --brand-3: #e0608f; --brand-ink: #ffffff; --brand-soft: #2a2550;
      --bot: #25223f; --focus: #a998ff;
      --ok: #5fd3a3; --ok-bg: #143327; --info: #8bb4ff; --info-bg: #182a47;
      --warn: #ffc56b; --warn-bg: #3a2a10; --bad: #ff9b90; --bad-bg: #3f1b18; --neutral: #b7b3cf; --neutral-bg: #2a2742;
      --t-blue: #93b3ff; --t-blue-bg: #1d2a4d; --t-amber: #ffc271; --t-amber-bg: #3b2a12;
      --t-green: #6fd8a9; --t-green-bg: #163528; --t-teal: #73d3e2; --t-teal-bg: #133339;
      --t-pink: #ff8fbe; --t-pink-bg: #3d1a2b; --t-violet: #b9a3ff; --t-violet-bg: #2b2250;
      --t-orange: #ffa77a; --t-orange-bg: #3d2215;
      --shadow: 0 10px 40px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(135deg, var(--page-a), var(--page-b) 55%, var(--page-c)); background-attachment: fixed; }
  svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }
  .app { max-width: 760px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--panel); }
  @media (min-width: 800px) {
    body { padding: 20px; }
    .app { height: calc(100vh - 40px); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
  }

  /* Header */
  header { background: linear-gradient(120deg, #4527d6, #8f2bb5 60%, #c2326e); color: #fff;
           padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
  .logo svg.i { width: 22px; height: 22px; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .1px; }
  .online { display: flex; align-items: center; gap: 6px; font-size: 12.5px; opacity: .95; margin: 1px 0 0; }
  .online::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #5ef0a8; box-shadow: 0 0 0 3px rgba(94,240,168,.25); }
  .hbtn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); color: #fff;
          border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .hbtn:hover { background: rgba(255,255,255,.26); }

  /* Account bar */
  .account { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--soft); display: flex; flex-direction: column; gap: 8px; }
  .acct-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .acct-name { display: flex; flex-direction: column; line-height: 1.25; margin-right: auto; }
  .acct-name b { font-size: 14px; }
  .acct-name span { font-size: 12px; color: var(--muted); }
  .acct-top label { font-size: 12px; color: var(--muted); }
  .account select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
                    background: var(--panel); color: var(--text); max-width: 100%; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
            border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .toggle[aria-expanded="true"] { border-color: var(--brand); color: var(--brand); }
  .recharges { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: thin; }
  .recharges[hidden] { display: none; }
  .rc { flex: 0 0 auto; min-width: 128px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px;
        display: flex; flex-direction: column; gap: 3px; }
  .rc b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .rc small { color: var(--muted); font-size: 12px; }
  .note { font-size: 12px; color: var(--muted); }

  /* Pills (status) */
  .pill { display: inline-flex; align-items: center; gap: 5px; width: fit-content; border-radius: 999px; padding: 2px 9px;
          font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.info { background: var(--info-bg); color: var(--info); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.neutral { background: var(--neutral-bg); color: var(--neutral); }
  .pill svg.i { width: 13px; height: 13px; }

  /* Conversation */
  #log { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .bot-row { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; align-self: flex-start; }
  .bot-av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-3)); }
  .bot-av svg.i { width: 15px; height: 15px; }
  .msg { padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--bot); border-bottom-left-radius: 6px; }
  .user { align-self: flex-end; max-width: 85%; color: #fff; border-bottom-right-radius: 6px;
          background: linear-gradient(135deg, #5b3df5, #8b3fd9); box-shadow: 0 4px 14px rgba(91,61,245,.25); }
  .indent { margin-left: 36px; max-width: calc(92% - 36px); align-self: flex-start; }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; animation: bounce 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }

  .banner { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; }
  .banner.urgent { background: var(--bad-bg); color: var(--bad); }
  .banner.info { background: var(--info-bg); color: var(--info); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }

  .cite { display: inline-block; background: var(--brand-soft); color: var(--brand); border-radius: 6px; font-size: 11px; font-weight: 600;
          padding: 0 6px; margin: 0 1px; vertical-align: 1px; cursor: pointer; border: 0; font-family: inherit; }
  .meta { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--brand); font-weight: 600; width: fit-content; }
  .src { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .src li { border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 8px; padding: 6px 10px; background: var(--panel); }
  .src b { color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  /* Buttons */
  button { font: inherit; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
          border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  .chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .chip.amount { font-weight: 700; font-size: 14px; padding: 7px 16px; border: 2px solid var(--brand); color: var(--brand); }
  .chip.amount:hover:not(:disabled) { background: var(--brand-soft); }
  .btn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px; padding: 8px 16px;
         font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; }
  .btn.brand { background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
  .btn.go { background: #0f8a5f; }
  .btn.person { background: linear-gradient(135deg, #e0532f, #c2326e); }
  button:disabled { opacity: .5; cursor: default; }

  /* Refund card */
  .card { border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); color: var(--text);
          font-size: 14px;
          border: 1px solid var(--line); border-top: 4px solid #0f8a5f; box-shadow: 0 6px 20px rgba(15,138,95,.12); }
  .card .label { font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--ok); }
  .card .amt { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }

  /* Welcome */
  .hero { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
  .bot-row.welcome { max-width: 100%; }
  .hero h2 { font-size: 20px; margin: 0; background: linear-gradient(120deg, var(--brand), var(--brand-3));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent; border-radius: 14px;
          padding: 10px 12px; cursor: pointer; color: var(--text); font-size: 13.5px; line-height: 1.3; }
  .tile .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; background: var(--panel); }
  .tile:hover { border-color: currentColor; }
  .tile.blue { background: var(--t-blue-bg); } .tile.blue .ic { color: var(--t-blue); }
  .tile.amber { background: var(--t-amber-bg); } .tile.amber .ic { color: var(--t-amber); }
  .tile.green { background: var(--t-green-bg); } .tile.green .ic { color: var(--t-green); }
  .tile.teal { background: var(--t-teal-bg); } .tile.teal .ic { color: var(--t-teal); }
  .tile.pink { background: var(--t-pink-bg); } .tile.pink .ic { color: var(--t-pink); }
  .tile.violet { background: var(--t-violet-bg); } .tile.violet .ic { color: var(--t-violet); }
  .tile.orange { background: var(--t-orange-bg); } .tile.orange .ic { color: var(--t-orange); }

  /* Composer */
  form { display: flex; gap: 8px; align-items: flex-end; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; border: 1.5px solid var(--line); border-radius: 22px; padding: 11px 16px; font: inherit;
             background: var(--soft); color: var(--text); min-height: 46px; max-height: 140px; }
  textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .send { width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff;
          background: linear-gradient(135deg, var(--brand), var(--brand-3)); box-shadow: 0 4px 14px rgba(91,61,245,.3); flex-shrink: 0; }
  .send svg.i { width: 20px; height: 20px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; left: -9999px; }
  @media (max-width: 520px) {
    .hbtn .txt, .online .long { display: none; }
    .acct-top label { position: absolute; left: -9999px; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .tile { padding: 9px 10px; gap: 8px; font-size: 13px; }
    .tile .ic { width: 28px; height: 28px; }
    .bot-row.welcome .bot-av { display: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-signal" viewBox="0 0 24 24"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 4v16"/></symbol>
  <symbol id="i-bill" viewBox="0 0 24 24"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-3 2-3-2-3 2-3-2-3 2z"/><path d="M8 9h8M8 13h6"/></symbol>
  <symbol id="i-sim" viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><rect x="8" y="11" width="8" height="7" rx="1"/></symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2l-1.6 1.6 6.6 3.8-3.4 3.4-2.4-.4L3 15.6l3.5 1.9 1.9 3.5 1.2-1.2-.4-2.4 3.4-3.4 3.8 6.6z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
  <symbol id="i-refund" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v10M9.5 9.5h3.75a1.75 1.75 0 0 1 0 3.5h-2.5a1.75 1.75 0 0 0 0 3.5H14.5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
</svg>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"><svg class="i"><use href="#i-signal"/></svg></div>
    <div style="flex:1; min-width:0">
      <h1>NovaCell Support</h1>
      <p class="online" id="sub">Online<span class="long">&nbsp;· answers from NovaCell help content</span></p>
    </div>
    <button class="hbtn" id="clear" type="button" aria-label="Clear conversation">
      <svg class="i" aria-hidden="true"><use href="#i-trash"/></svg><span class="txt">Clear conversation</span>
    </button>
  </header>

  <section class="account" aria-label="Demo account">
    <div class="acct-top">
      <div class="avatar" id="avatar" aria-hidden="true">R</div>
      <div class="acct-name"><b id="acct-name">Loading…</b><span id="acct-plan">Demo customer</span></div>
      <label for="customer">Signed in as</label>
      <select id="customer" aria-describedby="demo-note"></select>
      <button class="toggle" id="rc-toggle" type="button" aria-expanded="false" aria-controls="recharge-rows">
        <svg class="i" aria-hidden="true"><use href="#i-list"/></svg>Recharges
      </button>
    </div>
    <div class="recharges" id="recharge-rows" hidden></div>
    <span id="demo-note" class="note" hidden>Demo only: this picker stands in for the signed-in account.</span>
  </section>

  <main id="log" aria-live="polite" aria-label="Conversation"></main>

  <form id="form">
    <label for="q" class="sr">Your question</label>
    <textarea id="q" rows="1" placeholder="Ask a question or request a refund" maxlength="2000"></textarea>
    <button class="send" type="submit" aria-label="Send"><svg class="i" aria-hidden="true"><use href="#i-send"/></svg></button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const q = document.getElementById('q');
let sessionId = null;
let busy = false;
let pendingCards = [];  // disablers for confirmation/amount buttons still on screen
let customerId = null;  // demo picker: which simulated account is "signed in"

const picker = document.getElementById('customer');
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const ago = d => d === 0 ? 'today' : d === 1 ? '1 day ago' : `${d} days ago`;
const AVATAR_COLORS = ['#5b3df5', '#c2326e', '#0f8a5f', '#d9631e', '#1d6fd6'];

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'i'); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#i-' + name); s.appendChild(u); return s;
}
function pill(kind, iconName, text) { const p = el('span', 'pill ' + kind); if (iconName) p.appendChild(icon(iconName)); p.appendChild(document.createTextNode(text)); return p; }
function scroll() { log.scrollTop = log.scrollHeight; }

// ---------- Demo account bar ----------
async function loadCustomers() {
  const data = await (await fetch('/api/demo/customers')).json();
  if (!picker.options.length) {
    for (const c of data.customers) { const o = el('option', null, `${c.name} (${c.user_id})`); o.value = c.user_id; picker.appendChild(o); }
    picker.value = customerId = data.default;
  }
  const idx = data.customers.findIndex(x => x.user_id === customerId);
  const c = data.customers[idx];
  const av = document.getElementById('avatar');
  av.textContent = c.name[0]; av.style.background = AVATAR_COLORS[idx % AVATAR_COLORS.length];
  document.getElementById('acct-name').textContent = c.name;
  document.getElementById('acct-plan').textContent = `${c.plan} plan · ${inr(c.plan_amount)}`;
  const list = document.getElementById('recharge-rows'); list.textContent = '';
  for (const r of c.recharges) {
    const card = el('div', 'rc');
    card.appendChild(el('b', null, inr(r.recharge_amount)));
    card.appendChild(el('small', null, `${ago(r.recharge_age_days)} · ${r.refund_status === 'refunded' ? 'refunded' : r.recharge_status}`));
    card.appendChild(r.refundable
      ? (r.recharge_amount > data.approval_limit ? pill('info', 'person', 'Refund via Support') : pill('ok', 'check', 'Refundable'))
      : pill(r.refund_status === 'refunded' ? 'neutral' : 'bad', 'x',
             r.refund_status === 'refunded' ? 'Already refunded'
             : r.recharge_status !== 'completed' ? `Payment ${r.recharge_status}`
             : r.recharge_age_days > 7 ? 'Over 7 days old' : 'Not refundable'));
    list.appendChild(card);
  }
}
const rcToggle = document.getElementById('rc-toggle');
rcToggle.onclick = () => {
  const list = document.getElementById('recharge-rows'); const open = list.hidden;
  list.hidden = !open; document.getElementById('demo-note').hidden = !open; rcToggle.setAttribute('aria-expanded', String(open));
};

// ---------- Messages ----------
function botRow(cls) {
  const row = el('div', 'bot-row');
  const av = el('div', 'bot-av'); av.appendChild(icon('spark')); av.setAttribute('aria-hidden', 'true');
  const bubble = el('div', 'msg bot' + (cls ? ' ' + cls : ''));
  row.appendChild(av); row.appendChild(bubble);
  return {row, bubble};
}
function botSay(text) { const {row, bubble} = botRow(); bubble.textContent = text; log.appendChild(row); scroll(); return bubble; }
function banner(kind, iconName, text) { const b = el('div', 'banner indent ' + kind); b.appendChild(icon(iconName)); b.appendChild(el('span', null, text)); return b; }

function renderAnswer(node, text, citations) {
  // Turn [FAQ-10] markers into chips that open the matching source.
  node.textContent = '';
  text = text.replace(/\*\*|__/g, '');  // the chat shows plain text; drop stray markdown bold
  const parts = text.split(/(\[(?:FAQ|TK|GUIDE)-[\d.]+\])/g);
  for (const part of parts) {
    const m = part.match(/^\[((?:FAQ|TK|GUIDE)-[\d.]+)\]$/);
    if (m) {
      const known = citations && citations.find(c => c.id === m[1]);
      if (citations && !known) continue;  // drop markers the server could not verify
      const b = el('button', 'cite', m[1]); b.type = 'button';
      b.setAttribute('aria-label', 'Source ' + m[1]);
      b.onclick = () => { const d = node.closest('.wrap') && node.closest('.wrap').querySelector('details'); if (d) d.open = true; };
      node.appendChild(b);
    } else node.appendChild(document.createTextNode(part));
  }
}

function sourceLabel(s) { return {faq: 'FAQ', ticket: 'Past resolved case', guide: 'User guide'}[s] || s; }

const STATE_PILL = {
  refund_processed: ['ok', 'check', 'Refund processed'], refund_rejected: ['bad', 'x', 'Refund not possible'],
  refund_cancelled: ['neutral', 'x', 'Refund cancelled'], refund_submitted_for_review: ['info', 'person', 'Sent to Support Team'],
  awaiting_amount: ['warn', 'clock', 'Choose an amount'], awaiting_confirmation: ['warn', 'clock', 'Waiting for your confirmation'],
};

function personButton(reasons) {
  const h = el('button', 'btn person'); h.type = 'button'; h.appendChild(icon('person')); h.appendChild(document.createTextNode('Talk to a person'));
  h.onclick = () => handoff(reasons, h);
  return h;
}

function addRefund(wrap, done) {
  const r = done.refund;
  const meta = el('div', 'meta indent');
  if (r.state === 'awaiting_confirmation') {
    const card = el('div', 'card');
    card.setAttribute('role', 'group'); card.setAttribute('aria-label', 'Refund confirmation');
    card.appendChild(el('span', 'label', 'Refund eligible'));
    card.appendChild(el('span', 'amt', inr(r.amount)));
    card.appendChild(el('div', null, 'Do you want to proceed with this refund?'));
    const row = el('div', 'row');
    const yes = el('button', 'btn go'); yes.type = 'button'; yes.appendChild(icon('check')); yes.appendChild(document.createTextNode('Confirm Refund'));
    const no = el('button', 'chip', 'Cancel'); no.type = 'button';
    const lock = () => { yes.disabled = true; no.disabled = true; };
    yes.onclick = () => { lock(); ask('Yes, proceed', {action: 'confirm', refund_id: r.id}); };
    no.onclick = () => { lock(); ask('Cancel', {action: 'cancel', refund_id: r.id}); };
    row.appendChild(yes); row.appendChild(no); card.appendChild(row);
    meta.appendChild(card);
    pendingCards.push(lock);
  } else if (r.state === 'awaiting_amount' && r.options && r.options.length) {
    // Offer the refundable recharges as buttons.
    const row = el('div', 'row');
    const buttons = r.options.map(a => {
      const b = el('button', 'chip amount', inr(a)); b.type = 'button';
      b.onclick = () => { buttons.forEach(x => x.disabled = true); ask(inr(a)); };
      row.appendChild(b); return b;
    });
    pendingCards.push(() => buttons.forEach(x => x.disabled = true));
    meta.appendChild(row);
  } else if (STATE_PILL[r.state]) {
    pendingCards.forEach(f => f()); pendingCards = [];
    const [kind, ic, label] = STATE_PILL[r.state];
    meta.appendChild(pill(kind, ic, label + (r.refund_id ? ` · ${r.refund_id}` : '') + (r.request_id ? ` · ${r.request_id}` : '')));
  }
  if (done.handoff && done.handoff.offer) {
    // Rejected, or above ₹499: the bot can't refund it, so lead straight to a person.
    const row = el('div', 'row'); row.appendChild(personButton(done.handoff.reasons)); meta.appendChild(row);
  }
  wrap.appendChild(meta);
}

function addMeta(wrap, done) {
  if (done.refund) { addRefund(wrap, done); return; }
  const meta = el('div', 'meta indent');
  if (done.citations && done.citations.length) {
    const d = el('details');
    d.appendChild(el('summary', null, `Sources (${done.citations.length})`));
    const ul = el('ul', 'src');
    for (const c of done.citations) {
      const li = el('li'); li.appendChild(el('b', null, `${c.id} · ${sourceLabel(c.source)}`)); li.appendChild(el('div', null, c.title));
      ul.appendChild(li);
    }
    d.appendChild(ul); meta.appendChild(d);
  }
  if (!done.grounded) meta.appendChild(banner('warn', 'alert', "I couldn't verify every part of this answer against our sources. Please double-check with our team."));
  const row = el('div', 'row');
  if (done.answer_id && !done.abstained) {
    row.appendChild(el('span', null, 'Helpful?'));
    for (const [label, val] of [['👍 Yes', true], ['👎 No', false]]) {
      const b = el('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.onclick = async () => {
        row.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        await fetch('/api/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({answer_id: done.answer_id, helpful: val})});
      };
      row.appendChild(b);
    }
  }
  if (done.handoff && done.handoff.offer) row.appendChild(personButton(done.handoff.reasons));
  else {
    const h = el('button', 'chip'); h.type = 'button'; h.appendChild(icon('person')); h.appendChild(document.createTextNode('Talk to a person'));
    h.onclick = () => handoff(['customer_clicked'], h); row.appendChild(h);
  }
  meta.appendChild(row);
  wrap.appendChild(meta);
}

async function handoff(reasons, btn) {
  btn.disabled = true;
  const r = await fetch('/api/handoff', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId, reasons})});
  const data = await r.json();
  botSay(data.message);
}

async function ask(text, extra) {
  if (busy || !text.trim()) return;
  busy = true;
  log.appendChild(el('div', 'msg user', text));
  const wrap = el('div', 'wrap'); wrap.style.display = 'contents';
  const {row, bubble} = botRow('typing');
  const dots = el('span', 'dots'); dots.setAttribute('aria-label', 'Assistant is typing');
  dots.append(el('span'), el('span'), el('span')); bubble.appendChild(dots);
  wrap.appendChild(row); log.appendChild(wrap); scroll();
  let full = '';
  try {
    const resp = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId, customer_id: customerId, ...(extra || {})})});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'meta') {
          sessionId = ev.session_id;
          if (ev.banner) wrap.insertBefore(banner('urgent', 'alert', ev.banner), row);
          if (ev.pii_notice) wrap.insertBefore(banner('info', 'shield', ev.pii_notice), row);
        } else if (ev.type === 'delta') {
          full += ev.text; renderAnswer(bubble, full, null); scroll();
        } else if (ev.type === 'done') {
          bubble.classList.remove('typing');
          renderAnswer(bubble, full, ev.citations);
          addMeta(wrap, ev); scroll();
          if (ev.refund) loadCustomers();  // refresh the recharge list after a refund changes it
        }
      }
    }
  } catch (e) {
    bubble.textContent = "Sorry, something went wrong. Please try again, or call 611 to reach our team.";
  }
  bubble.classList.remove('typing');
  busy = false;
}

// ---------- Welcome screen ----------
const TOPICS = [
  ['blue', 'signal', 'Why is my mobile data so slow?'],
  ['amber', 'bill', 'Why is my bill higher than usual?'],
  ['green', 'sim', "My eSIM won't activate"],
  ['teal', 'plane', 'How do I set up roaming before I travel?'],
  ['pink', 'phone', 'My calls keep dropping'],
  ['violet', 'up', 'How do I upgrade my plan?'],
  ['orange', 'refund', 'Refund a recharge'],
];
function renderWelcome() {
  const {row, bubble} = botRow();
  row.classList.add('welcome');
  bubble.classList.add('hero');
  bubble.appendChild(el('h2', null, 'Hi! How can we help today?'));
  bubble.appendChild(el('p', null, "I can answer questions about mobile data, bills, SIM and eSIM, roaming and calls, and I can refund a recent recharge. Pick a topic or type your question."));
  const tiles = el('div', 'tiles');
  for (const [color, ic, text] of TOPICS) {
    const t = el('button', 'tile ' + color); t.type = 'button';
    const box = el('span', 'ic'); box.appendChild(icon(ic)); t.appendChild(box); t.appendChild(el('span', null, text));
    t.onclick = () => ask(text);
    tiles.appendChild(t);
  }
  bubble.appendChild(tiles);
  log.appendChild(row);
}

form.addEventListener('submit', e => { e.preventDefault(); const t = q.value; q.value = ''; ask(t); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
async function clearConversation() {
  if (sessionId) await fetch('/api/session/clear', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId})});
  sessionId = null; pendingCards = [];
  log.textContent = ''; renderWelcome();
}
document.getElementById('clear').onclick = async () => { if (busy) return; await clearConversation(); q.focus(); };
// Switching customer is like signing in as someone else: start a fresh conversation.
picker.onchange = async () => {
  if (busy) { picker.value = customerId; return; }
  customerId = picker.value;
  await clearConversation();
  await loadCustomers();
};
renderWelcome();
loadCustomers();
fetch('/api/health').then(r => r.json()).then(h => {
  if (h.mode === 'offline') document.getElementById('sub').firstChild.textContent = 'Offline mode';
});
</script>
