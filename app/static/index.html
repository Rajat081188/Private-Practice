<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaCell Support</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
    --brand: #4b2bd6; --brand-ink: #ffffff; --bot: #f0f1f4; --user: #4b2bd6; --user-ink: #fff;
    --warn-bg: #fff4e0; --warn-ink: #7a4b00; --cite-bg: #ece8ff; --cite-ink: #3a20b0; --focus: #8b74ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --text: #e8eaee; --muted: #9aa3ae; --line: #2c313a;
      --brand: #8b74ff; --brand-ink: #0f0b24; --bot: #232831; --user: #6c52f0; --user-ink: #fff;
      --warn-bg: #3a2c12; --warn-ink: #ffd89a; --cite-bg: #2c2550; --cite-ink: #c9bdff; --focus: #b3a4ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 720px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--panel);
         border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: var(--brand-ink);
          display: grid; place-items: center; font-weight: 700; }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; font-size: 12.5px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--user); color: var(--user-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .banner { background: var(--warn-bg); color: var(--warn-ink); padding: 8px 12px; border-radius: 10px; font-size: 13.5px; align-self: stretch; }
  .cite { display: inline-block; background: var(--cite-bg); color: var(--cite-ink); border-radius: 6px; font-size: 11px;
          padding: 0 5px; margin: 0 1px; vertical-align: 1px; cursor: pointer; border: 0; font-family: inherit; }
  .meta { align-self: flex-start; max-width: 88%; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; }
  .src { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .src li { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .src b { color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 999px;
                 padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button.ghost[aria-pressed="true"] { border-color: var(--brand); color: var(--brand); }
  button.primary { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 999px; padding: 6px 14px;
                   font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .chips { padding: 0 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit;
             background: var(--panel); color: var(--text); min-height: 44px; max-height: 140px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sr { position: absolute; left: -9999px; }
  .card { align-self: flex-start; max-width: 88%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
          display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
  .card b { font-size: 15px; }
  .status { font-size: 12.5px; color: var(--muted); }
  header button.ghost { flex-shrink: 0; }
  .demo { padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted);
          display: flex; flex-direction: column; gap: 6px; }
  .demo label { font-weight: 600; color: var(--text); }
  .demo select { font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 8px; border: 1px solid var(--line);
                 background: var(--panel); color: var(--text); max-width: 100%; }
  .muted-note { font-size: 12px; }
  .demo summary { cursor: pointer; color: var(--text); }
  .demo table { border-collapse: collapse; margin-top: 6px; width: 100%; font-variant-numeric: tabular-nums; }
  .demo th, .demo td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .demo th { font-weight: 600; }
  .ok { color: var(--brand); font-weight: 600; }
  @media (max-width: 480px) { #sub { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">N</div>
    <div style="flex:1">
      <h1>NovaCell Support Assistant</h1>
      <p id="sub">AI assistant · answers come from NovaCell help content · ask for a person any time</p>
    </div>
    <button class="ghost" id="clear" type="button">Clear conversation</button>
  </header>
  <div class="demo" aria-label="Demo controls">
    <div class="row">
      <label for="customer">Demo customer</label>
      <select id="customer" aria-describedby="demo-note"></select>
      <span id="demo-note" class="muted-note">stands in for the signed-in account</span>
    </div>
    <details id="recharges">
      <summary>Recharges on this account</summary>
      <table>
        <thead><tr><th>Amount</th><th>When</th><th>Status</th><th>Refund</th></tr></thead>
        <tbody id="recharge-rows"></tbody>
      </table>
    </details>
  </div>
  <main id="log" aria-live="polite" aria-label="Conversation"></main>
  <div class="chips" id="chips" aria-label="Suggested questions">
    <button class="ghost">Why is my mobile data so slow?</button>
    <button class="ghost">Why is my bill higher than usual?</button>
    <button class="ghost">My eSIM won't activate</button>
    <button class="ghost">How do I set up roaming before I travel?</button>
    <button class="ghost">My calls keep dropping</button>
    <button class="ghost">How do I upgrade my plan?</button>
  </div>
  <form id="form">
    <label for="q" class="sr">Your question</label>
    <textarea id="q" rows="1" placeholder="Ask about data, bills, SIMs, roaming or calls" maxlength="2000"></textarea>
    <button class="primary" type="submit">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const q = document.getElementById('q');
let sessionId = null;
let busy = false;
let pendingCards = [];  // disablers for confirmation buttons still on screen
let customerId = null;  // demo picker: which simulated account is "signed in"

const picker = document.getElementById('customer');
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const ago = d => d === 0 ? 'today' : d === 1 ? '1 day ago' : `${d} days ago`;

async function loadCustomers() {
  const data = await (await fetch('/api/demo/customers')).json();
  if (!picker.options.length) {
    for (const c of data.customers) {
      const o = el('option', null, `${c.name} · ${c.plan} plan (${c.user_id})`); o.value = c.user_id; picker.appendChild(o);
    }
    picker.value = customerId = data.default;
  }
  const c = data.customers.find(x => x.user_id === customerId);
  const rows = document.getElementById('recharge-rows'); rows.textContent = '';
  for (const r of c.recharges) {
    const tr = el('tr');
    tr.appendChild(el('td', null, inr(r.recharge_amount)));
    tr.appendChild(el('td', null, ago(r.recharge_age_days)));
    tr.appendChild(el('td', null, r.refund_status === 'refunded' ? 'refunded' : r.recharge_status));
    const why = r.refundable ? (r.recharge_amount > data.approval_limit ? 'Yes, via Support Team' : 'Yes, here')
      : r.refund_status === 'refunded' ? 'No – already refunded'
      : r.recharge_status !== 'completed' ? `No – payment ${r.recharge_status}`
      : r.recharge_age_days > 7 ? 'No – older than 7 days' : 'No';
    tr.appendChild(el('td', r.refundable ? 'ok' : null, why));
    rows.appendChild(tr);
  }
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll() { log.scrollTop = log.scrollHeight; }

function renderAnswer(node, text, citations) {
  // Turn [FAQ-10] markers into chips that open the matching source.
  node.textContent = '';
  text = text.replace(/\*\*|__/g, '');  // the chat shows plain text; drop stray markdown bold
  const parts = text.split(/(\[(?:FAQ|TK|GUIDE)-[\d.]+\])/g);
  for (const part of parts) {
    const m = part.match(/^\[((?:FAQ|TK|GUIDE)-[\d.]+)\]$/);
    if (m) {
      const known = citations && citations.find(c => c.id === m[1]);
      if (citations && !known) continue;  // drop markers the server could not verify
      const b = el('button', 'cite', m[1]); b.type = 'button';
      b.setAttribute('aria-label', 'Source ' + m[1]);
      b.onclick = () => { const d = node.parentElement.querySelector('details'); if (d) d.open = true; };
      node.appendChild(b);
    } else node.appendChild(document.createTextNode(part));
  }
}

function sourceLabel(s) { return {faq: 'FAQ', ticket: 'Past resolved case', guide: 'User guide'}[s] || s; }

const STATE_LABEL = {
  refund_processed: 'Refund processed', refund_rejected: 'Refund not possible', refund_cancelled: 'Refund cancelled',
  refund_submitted_for_review: 'Sent to Support Team for review', awaiting_amount: 'Waiting for the amount',
  awaiting_confirmation: 'Waiting for your confirmation',
};

function addRefund(wrap, done) {
  const r = done.refund;
  if (r.state === 'awaiting_confirmation') {
    const card = el('div', 'card');
    card.setAttribute('role', 'group'); card.setAttribute('aria-label', 'Refund confirmation');
    card.appendChild(el('b', null, `Refund eligible: ₹${Number(r.amount).toLocaleString('en-IN')}`));
    card.appendChild(el('div', null, 'Do you want to proceed with this refund?'));
    const row = el('div', 'row');
    const yes = el('button', 'primary', 'Confirm Refund'); yes.type = 'button';
    const no = el('button', 'ghost', 'Cancel'); no.type = 'button';
    const lock = () => { yes.disabled = true; no.disabled = true; };
    yes.onclick = () => { lock(); ask('Yes, proceed', {action: 'confirm', refund_id: r.id}); };
    no.onclick = () => { lock(); ask('Cancel', {action: 'cancel', refund_id: r.id}); };
    row.appendChild(yes); row.appendChild(no); card.appendChild(row);
    wrap.appendChild(card);
    pendingCards.push(lock);
  } else if (r.state === 'awaiting_amount' && r.options && r.options.length) {
    // Offer the refundable recharges as buttons.
    const row = el('div', 'row meta');
    const buttons = r.options.map(a => {
      const b = el('button', 'ghost', inr(a)); b.type = 'button';
      b.onclick = () => { buttons.forEach(x => x.disabled = true); ask(inr(a)); };
      row.appendChild(b); return b;
    });
    pendingCards.push(() => buttons.forEach(x => x.disabled = true));
    wrap.appendChild(row);
  } else if (STATE_LABEL[r.state]) {
    pendingCards.forEach(f => f()); pendingCards = [];
    wrap.appendChild(el('div', 'status meta', STATE_LABEL[r.state] + (r.refund_id ? ` · ${r.refund_id}` : '') +
      (r.request_id ? ` · ${r.request_id}` : '')));
  }
  if (done.handoff && done.handoff.offer) {
    // Rejected, or above ₹499: the bot can't refund it, so lead straight to a person.
    const row = el('div', 'row meta');
    const h = el('button', 'primary', 'Talk to a person'); h.type = 'button';
    h.onclick = () => handoff(done.handoff.reasons, h);
    row.appendChild(h); wrap.appendChild(row);
  }
}

function addMeta(wrap, done) {
  if (done.refund) {
    addRefund(wrap, done);
    return;
  }
  const meta = el('div', 'meta');
  if (done.citations && done.citations.length) {
    const d = el('details');
    d.appendChild(el('summary', null, `Sources (${done.citations.length})`));
    const ul = el('ul', 'src');
    for (const c of done.citations) {
      const li = el('li'); const b = el('b', null, `${c.id} · ${sourceLabel(c.source)}`);
      li.appendChild(b); li.appendChild(el('div', null, c.title));
      ul.appendChild(li);
    }
    d.appendChild(ul); meta.appendChild(d);
  }
  if (!done.grounded) meta.appendChild(el('div', 'banner', "I couldn't verify every part of this answer against our sources. Please double-check with our team."));
  const row = el('div', 'row');
  if (done.answer_id && !done.abstained) {
    row.appendChild(el('span', null, 'Helpful?'));
    for (const [label, val] of [['👍 Yes', true], ['👎 No', false]]) {
      const b = el('button', 'ghost', label); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.onclick = async () => {
        row.querySelectorAll('button.ghost').forEach(x => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        await fetch('/api/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({answer_id: done.answer_id, helpful: val})});
      };
      row.appendChild(b);
    }
  }
  if (done.handoff && done.handoff.offer) {
    const h = el('button', 'primary', 'Talk to a person'); h.type = 'button';
    h.onclick = () => handoff(done.handoff.reasons, h);
    row.appendChild(h);
  } else {
    const h = el('button', 'ghost', 'Talk to a person'); h.type = 'button';
    h.onclick = () => handoff(['customer_clicked'], h);
    row.appendChild(h);
  }
  meta.appendChild(row);
  wrap.appendChild(meta);
}

async function handoff(reasons, btn) {
  btn.disabled = true;
  const r = await fetch('/api/handoff', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId, reasons})});
  const data = await r.json();
  log.appendChild(el('div', 'msg bot', data.message)); scroll();
}

async function ask(text, extra) {
  if (busy || !text.trim()) return;
  busy = true;
  document.getElementById('chips').hidden = true;
  log.appendChild(el('div', 'msg user', text));
  const wrap = el('div'); wrap.style.display = 'contents';
  const bubble = el('div', 'msg bot typing');
  wrap.appendChild(bubble); log.appendChild(wrap); scroll();
  let full = '';
  try {
    const resp = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId, customer_id: customerId, ...(extra || {})})});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'meta') {
          sessionId = ev.session_id;
          if (ev.banner) wrap.insertBefore(el('div', 'banner', ev.banner), bubble);
          if (ev.pii_notice) wrap.insertBefore(el('div', 'banner', ev.pii_notice), bubble);
        } else if (ev.type === 'delta') {
          full += ev.text; renderAnswer(bubble, full, null); scroll();
        } else if (ev.type === 'done') {
          bubble.classList.remove('typing');
          renderAnswer(bubble, full, ev.citations);
          addMeta(wrap, ev); scroll();
          if (ev.refund) loadCustomers();  // refresh the recharge list after a refund changes it
        }
      }
    }
  } catch (e) {
    bubble.classList.remove('typing');
    bubble.textContent = "Sorry, something went wrong. Please try again, or call 611 to reach our team.";
  }
  bubble.classList.remove('typing');
  busy = false;
}

form.addEventListener('submit', e => { e.preventDefault(); const t = q.value; q.value = ''; ask(t); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
document.querySelectorAll('#chips button').forEach(b => b.onclick = () => ask(b.textContent));
const GREETING = "Hi, I'm NovaCell's support assistant. I can help with mobile data, bills, SIM and eSIM, roaming and calls, and I can request a refund of a recent recharge.";
log.appendChild(el('div', 'msg bot', GREETING));
async function clearConversation() {
  if (sessionId) await fetch('/api/session/clear', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId})});
  sessionId = null; pendingCards = [];
  log.textContent = ''; log.appendChild(el('div', 'msg bot', GREETING));
  document.getElementById('chips').hidden = false;
}
document.getElementById('clear').onclick = async () => { if (busy) return; await clearConversation(); q.focus(); };
// Switching customer is like signing in as someone else: start a fresh conversation.
picker.onchange = async () => {
  if (busy) { picker.value = customerId; return; }
  customerId = picker.value;
  await clearConversation();
  await loadCustomers();
};
loadCustomers();
fetch('/api/health').then(r => r.json()).then(h => {
  if (h.mode === 'offline') document.getElementById('sub').textContent += ' · offline mode (no AI key set)';
});
</script>
</body>
</html>
